<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWave Admin - Sign in</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2310b981'/><text x='50' y='68' font-size='54' text-anchor='middle'>🛡</text></svg>">

    <style>
        :root {
            --emerald: #10b981;
            --teal: #14b8a6;
            --cyan: #22d3ee;
            --slate-900: #0b1220;
            --slate-800: #111b2e;
            --slate-700: #1e2b42;
            --slate-400: #94a3b8;
            --slate-200: #e2e8f0;
            --danger: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--slate-900);
            color: var(--slate-200);
            min-height: 100vh;
            min-height: 100dvh;
        }

        .admin-container {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            padding: 1rem;
            overflow: hidden;
        }

        /* ---------- Background ---------- */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
            pointer-events: none;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            animation: drift 16s ease-in-out infinite;
        }
        .glow-1 { width: 420px; height: 420px; background: var(--emerald); opacity: 0.35; top: -140px; right: -100px; }
        .glow-2 { width: 380px; height: 380px; background: var(--cyan); opacity: 0.22; bottom: -150px; left: -120px; animation-delay: -6s; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-30px, 30px) scale(1.1); }
        }

        /* ---------- Card ---------- */
        .admin-box {
            position: relative;
            z-index: 1;
            margin: auto;
            width: 100%;
            max-width: 420px;
            padding: 2.25rem 2rem 1.75rem;
            border-radius: 24px;
            background: rgba(17, 27, 46, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7);
            animation: rise 0.5s ease;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Logo ---------- */
        .brand { text-align: center; margin-bottom: 1.5rem; }

        .logo {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--emerald) 0%, var(--teal) 55%, var(--cyan) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 14px 30px -8px rgba(16, 185, 129, 0.6);
            transform: rotate(-6deg);
        }

        .logo::after {
            content: "";
            position: absolute;
            inset: -7px;
            border-radius: 30px;
            border: 2px solid rgba(16, 185, 129, 0.35);
            animation: ring 2.8s ease-out infinite;
        }

        @keyframes ring {
            0%   { transform: scale(0.94); opacity: 1; }
            100% { transform: scale(1.22); opacity: 0; }
        }

        .logo svg { width: 44px; height: 44px; transform: rotate(6deg); }

        .brand h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .brand h1 span {
            background: linear-gradient(90deg, var(--emerald), var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.6rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.14);
            color: var(--emerald);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .badge::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald);
            animation: blink 1.8s ease-in-out infinite;
        }

        @keyframes blink { 50% { opacity: 0.25; } }

        .subtitle {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: var(--slate-400);
        }

        /* ---------- Inputs ---------- */
        .field { position: relative; margin-bottom: 0.9rem; }

        .field .field-icon {
            position: absolute;
            top: 50%;
            left: 0.95rem;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--slate-400);
            pointer-events: none;
            transition: color 0.2s;
        }

        .field input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border: 2px solid var(--slate-700);
            border-radius: 14px;
            background: var(--slate-900);
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field input::placeholder { color: #64748b; }

        .field input:focus {
            outline: none;
            border-color: var(--emerald);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
        }

        .field:focus-within .field-icon { color: var(--emerald); }

        .field.has-toggle input { padding-right: 3rem; }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 0.45rem;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--slate-400);
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .toggle-password:hover,
        .toggle-password:focus-visible {
            background: var(--slate-700);
            color: var(--emerald);
            outline: none;
        }

        .toggle-password svg { width: 20px; height: 20px; }
        .toggle-password .icon-eye-off { display: none; }
        .toggle-password.showing .icon-eye { display: none; }
        .toggle-password.showing .icon-eye-off { display: block; }

        /* ---------- Button ---------- */
        .btn-login {
            width: 100%;
            margin-top: 0.4rem;
            padding: 0.9rem;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, var(--emerald) 0%, var(--teal) 100%);
            color: #04211a;
            font-size: 1.02rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 0 10px 22px -8px rgba(16, 185, 129, 0.65);
            transition: transform 0.15s, filter 0.2s;
        }

        .btn-login:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.7; cursor: wait; transform: none; }

        /* ---------- Messages ---------- */
        .message {
            min-height: 1.3rem;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--danger);
        }

        .message.info { color: var(--emerald); }

        .secure-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 1.25rem;
            padding-top: 1.1rem;
            border-top: 1px solid var(--slate-700);
            font-size: 0.78rem;
            color: var(--slate-400);
        }

        .secure-note svg { width: 14px; height: 14px; color: var(--emerald); }

        /* ---------- Small screens ---------- */
        @media (max-width: 480px) {
            .admin-box { padding: 1.75rem 1.25rem 1.5rem; border-radius: 20px; }
            .logo { width: 70px; height: 70px; }
            .logo svg { width: 38px; height: 38px; }
            .brand h1 { font-size: 1.5rem; }
            .field input { font-size: 16px; } /* stops iOS zoom on focus */
        }

        @media (prefers-reduced-motion: reduce) {
            .glow, .logo::after, .badge::before, .admin-box { animation: none; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="grid-bg"></div>
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="admin-box">

            <!-- Brand / logo -->
            <div class="brand">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5l8-3z"/>
                        <path d="M8.5 12l2.5 2.5 4.5-5"/>
                    </svg>
                </div>
                <h1>ChatWave <span>Admin</span></h1>
                <div class="badge">Control Center</div>
                <p class="subtitle">Sign in to manage users and conversations</p>
            </div>

            <!-- Login form -->
            <form id="adminLoginForm" novalidate>
                <div class="field">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="admin-username" placeholder="Admin username"
                           autocomplete="username" autocapitalize="none" autocorrect="off"
                           spellcheck="false" required>
                </div>

                <div class="field has-toggle">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="admin-password" placeholder="Password"
                           autocomplete="current-password" required>
                    <button type="button" class="toggle-password" id="togglePassword"
                            aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">Access dashboard</button>
            </form>

            <div id="message" class="message" role="alert"></div>

            <div class="secure-note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Restricted area. Administrators only.
            </div>
        </div>
    </div>

    <!-- config.js must load first: it defines API_URL -->
    <script src="js/config.js"></script>

    <script>
        var form = document.getElementById('adminLoginForm');
        var btn = document.getElementById('loginBtn');
        var msg = document.getElementById('message');

        function setMessage(text, type) {
            msg.textContent = text || '';
            msg.className = 'message' + (type === 'info' ? ' info' : '');
        }

        function formatDetail(detail, fallback) {
            if (!detail) return fallback;
            if (typeof detail === 'string') return detail;
            if (Array.isArray(detail)) {
                return detail.map(function (d) { return d.msg; }).join('; ');
            }
            return fallback;
        }

        // Saved under both sets of keys so the dashboard finds the session
        function saveSession(token, user) {
            localStorage.setItem('token', token);
            localStorage.setItem('user', JSON.stringify(user));
            localStorage.setItem('admin_token', token);
            localStorage.setItem('admin_user', JSON.stringify(user));
        }

        function clearSession() {
            ['token', 'user', 'admin_token', 'admin_user'].forEach(function (k) {
                localStorage.removeItem(k);
            });
        }

        // Visit index.html?logout=1 to clear a stale session
        if (new URLSearchParams(window.location.search).get('logout') === '1') {
            clearSession();
        }

        // Already signed in as an admin? Go straight to the dashboard
        try {
            var savedUser = JSON.parse(localStorage.getItem('user') || 'null');
            if (localStorage.getItem('token') && savedUser && savedUser.is_admin) {
                window.location.href = 'dashboard.html';
            }
        } catch (e) { /* ignore corrupt saved data */ }

        // Show / hide password
        document.getElementById('togglePassword').addEventListener('click', function () {
            var input = document.getElementById('admin-password');
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            this.classList.toggle('showing', show);
            this.setAttribute('aria-pressed', show ? 'true' : 'false');
            this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            input.focus();
        });

        // Sign in
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            var username = document.getElementById('admin-username').value.trim();
            var password = document.getElementById('admin-password').value;

            if (!username || !password) {
                setMessage('Enter your username and password.');
                return;
            }
            if (typeof API_URL === 'undefined') {
                setMessage('API_URL is not defined. Make sure js/config.js loads first.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            setMessage('Contacting server... (it can take up to a minute if it was asleep)', 'info');

            var controller = new AbortController();
            var timer = setTimeout(function () { controller.abort(); }, 60000);

            try {
                var response = await fetch(API_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password }),
                    signal: controller.signal
                });

                var data = null;
                try { data = await response.json(); } catch (err) { /* non-JSON reply */ }

                if (!response.ok || !data || !data.access_token) {
                    setMessage(formatDetail(data && data.detail, 'Login failed (HTTP ' + response.status + ')'));
                    return;
                }

                if (!data.user || !data.user.is_admin) {
                    setMessage('This account does not have administrator access.');
                    return;
                }

                saveSession(data.access_token, data.user);
                setMessage('Welcome back! Redirecting...', 'info');
                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error('Admin login error:', err);
                if (err.name === 'AbortError') {
                    setMessage('The server took too long to respond. Please try again.');
                } else {
                    setMessage('Cannot reach the server. Check your connection and try again.');
                }
            } finally {
                clearTimeout(timer);
                btn.disabled = false;
                btn.textContent = 'Access dashboard';
            }
        });
    </script>
</body>
</html>
