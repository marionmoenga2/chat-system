<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWave - Sign in</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2310b981'/><text x='50' y='68' font-size='54' text-anchor='middle'>💬</text></svg>">

    <style>
        :root {
            --emerald: #10b981;
            --teal: #14b8a6;
            --cyan: #22d3ee;
            --slate-900: #0b1220;
            --slate-800: #111b2e;
            --slate-700: #1e2b42;
            --slate-400: #94a3b8;
            --slate-200: #e2e8f0;
            --danger: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        .hidden { display: none !important; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--slate-900);
            color: var(--slate-200);
            min-height: 100vh;
            min-height: 100dvh;
        }

        .auth-container {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            padding: 1rem;
            overflow: hidden;
        }

        /* ---------- Background ---------- */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
            pointer-events: none;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            animation: drift 16s ease-in-out infinite;
        }
        .glow-1 { width: 420px; height: 420px; background: var(--emerald); opacity: 0.35; top: -140px; right: -100px; }
        .glow-2 { width: 380px; height: 380px; background: var(--cyan); opacity: 0.22; bottom: -150px; left: -120px; animation-delay: -6s; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-30px, 30px) scale(1.1); }
        }

        /* ---------- Card ---------- */
        .auth-box {
            position: relative;
            z-index: 1;
            margin: auto;
            width: 100%;
            max-width: 420px;
            padding: 2.25rem 2rem 1.75rem;
            border-radius: 24px;
            background: rgba(17, 27, 46, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.18);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7);
            animation: rise 0.5s ease;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Logo ---------- */
        .brand { text-align: center; margin-bottom: 1.5rem; }

        .logo {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--emerald) 0%, var(--teal) 55%, var(--cyan) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 14px 30px -8px rgba(16, 185, 129, 0.6);
            transform: rotate(-6deg);
        }

        .logo::after {
            content: "";
            position: absolute;
            inset: -7px;
            border-radius: 30px;
            border: 2px solid rgba(16, 185, 129, 0.35);
            animation: ring 2.8s ease-out infinite;
        }

        @keyframes ring {
            0%   { transform: scale(0.94); opacity: 1; }
            100% { transform: scale(1.22); opacity: 0; }
        }

        .logo svg { width: 44px; height: 44px; transform: rotate(6deg); }

        .brand h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .brand h1 span {
            background: linear-gradient(90deg, var(--emerald), var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.6rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.14);
            color: var(--emerald);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .badge::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald);
            animation: blink 1.8s ease-in-out infinite;
        }

        @keyframes blink { 50% { opacity: 0.25; } }

        /* ---------- Headings ---------- */
        .form-title { text-align: center; font-size: 1.25rem; font-weight: 700; color: #fff; }
        .form-hint { margin: 0.3rem 0 1.25rem; text-align: center; font-size: 0.9rem; color: var(--slate-400); }

        /* ---------- Inputs ---------- */
        .field { position: relative; margin-bottom: 0.9rem; }

        .field .field-icon {
            position: absolute;
            top: 24px;
            left: 0.95rem;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--slate-400);
            pointer-events: none;
            transition: color 0.2s;
        }

        .field input {
            width: 100%;
            height: 48px;
            padding: 0 1rem 0 2.8rem;
            border: 2px solid var(--slate-700);
            border-radius: 14px;
            background: var(--slate-900);
            color: #fff;
            font: inherit;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field input::placeholder { color: #64748b; }

        .field input:focus {
            outline: none;
            border-color: var(--emerald);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
        }

        .field:focus-within .field-icon { color: var(--emerald); }

        .field-help { margin: 5px 0 0 4px; font-size: 0.78rem; color: #7889a3; }

        .field.has-toggle input { padding-right: 3rem; }

        .toggle-password {
            position: absolute;
            top: 24px;
            right: 0.45rem;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--slate-400);
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .toggle-password:hover,
        .toggle-password:focus-visible {
            background: var(--slate-700);
            color: var(--emerald);
            outline: none;
        }

        .toggle-password svg { width: 20px; height: 20px; }
        .toggle-password .icon-eye-off { display: none; }
        .toggle-password.showing .icon-eye { display: none; }
        .toggle-password.showing .icon-eye-off { display: block; }

        /* ---------- Button ---------- */
        .btn-login {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.9rem;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, var(--emerald) 0%, var(--teal) 100%);
            color: #04211a;
            font: inherit;
            font-size: 1.02rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 0 10px 22px -8px rgba(16, 185, 129, 0.65);
            transition: transform 0.15s, filter 0.2s;
        }

        .btn-login:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:focus-visible { outline: 3px solid rgba(16, 185, 129, 0.45); outline-offset: 2px; }
        .btn-login:disabled { opacity: 0.8; cursor: wait; transform: none; }
        .btn-login:disabled::after {
            content: "";
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-left: 10px;
            vertical-align: -2px;
            border: 2px solid rgba(4, 33, 26, 0.3);
            border-top-color: #04211a;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Switch link and messages ---------- */
        .switch-text { margin-top: 1.1rem; text-align: center; font-size: 0.9rem; color: var(--slate-400); }
        .switch-text a { color: var(--emerald); font-weight: 600; text-decoration: none; }
        .switch-text a:hover { text-decoration: underline; }

        #error-message {
            min-height: 1.3rem;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.875rem;
        }
        #error-message:empty { display: none; }

        .secure-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 1.25rem;
            padding-top: 1.1rem;
            border-top: 1px solid var(--slate-700);
            font-size: 0.78rem;
            color: var(--slate-400);
        }

        /* ---------- Small screens ---------- */
        @media (max-width: 480px) {
            .auth-box { padding: 1.75rem 1.25rem 1.5rem; border-radius: 20px; }
            .logo { width: 70px; height: 70px; }
            .logo svg { width: 38px; height: 38px; }
            .brand h1 { font-size: 1.5rem; }
            .field input { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .glow, .logo::after, .badge::before, .auth-box, .btn-login:disabled::after { animation: none; }
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1220">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ChatWave">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
    <div class="auth-container">
        <div class="grid-bg"></div>
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="auth-box">

            <!-- Brand / logo -->
            <div class="brand">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.7 8.7 0 0 1-3.6-.8L3 21l1.8-5.4A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/>
                        <path d="M8.5 11.5h.01M12.5 11.5h.01M16.5 11.5h.01" stroke-width="2.4"/>
                    </svg>
                </div>
                <h1>Chat<span>Wave</span></h1>
                <div class="badge">Chats &middot; Groups &middot; Calls</div>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="form-section">
                <h2 class="form-title">Welcome back</h2>
                <p class="form-hint">Sign in to pick up your conversations</p>
                <form id="loginForm">
                    <div class="field">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="login-username" placeholder="Username" aria-label="Username"
                               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                    </div>
                    <div class="field has-toggle">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="login-password" placeholder="Password" aria-label="Password"
                               autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="login-password"
                                aria-label="Show password" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="btn-login">Sign in</button>
                    <p class="switch-text">New here? <a href="#" onclick="toggleForms(); return false;">Create an account</a></p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form-section hidden">
                <h2 class="form-title">Create your account</h2>
                <p class="form-hint">It takes less than a minute</p>
                <form id="registerForm">
                    <div class="field">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="reg-username" placeholder="Choose a username" aria-label="Username"
                               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
                               required minlength="3">
                    </div>
                    <div class="field">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/>
                        </svg>
                        <input type="email" id="reg-email" placeholder="Email address" aria-label="Email address"
                               autocomplete="email" required>
                    </div>
                    <div class="field">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        <input type="tel" id="reg-phone" placeholder="Phone, e.g. +254 712 345 678" aria-label="Phone number"
                               autocomplete="tel" inputmode="tel" required>
                        <p class="field-help">Include your country code. Other users never see it; only site administrators can.</p>
                    </div>
                    <div class="field has-toggle">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="reg-password" placeholder="Create a password (6+ characters)" aria-label="Password"
                               autocomplete="new-password" required minlength="6">
                        <button type="button" class="toggle-password" data-target="reg-password"
                                aria-label="Show password" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="btn-login">Create account</button>
                    <p class="switch-text">Already a member? <a href="#" onclick="toggleForms(); return false;">Sign in</a></p>
                </form>
            </div>

            <div id="error-message" class="error-message" role="alert"></div>

            <div class="secure-note">&copy; ChatWave</div>
        </div>
    </div>

    <!-- config.js must load first: it defines API_URL and WS_URL -->
    <script src="js/config.js"></script>
    <script>fetch(API_URL + '/health/db').catch(function () {});</script>
    <script src="js/auth.js"></script>

    <!-- Show / hide password -->
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.dataset.target);
                if (!input) return;

                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';

                btn.classList.toggle('showing', show);
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');

                input.focus();
            });
        });
    </script>
    <script src="js/pwa.js"></script>
</body>
</html>
