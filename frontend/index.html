<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWave - Sign in</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232457c5'/><path d='M8 9h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H15l-5 4v-4H8a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z' fill='white'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=5">

    <style>
        :root {
            --ink: #14213a; --muted: #5b6b82; --line: #cdd6e4;
            --accent: #1f4fd8; --accent-dark: #1840b3; --danger: #b42318;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body { font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--ink); background: #1f4fd8; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* ---------- Colourful page ---------- */
        .shape { position: fixed; pointer-events: none; }
        .shape.s1 { width: 420px; height: 420px; border-radius: 50%; background: #ffc857; top: -150px; right: -120px; }
        .shape.s2 { width: 340px; height: 340px; border-radius: 50%; background: #ff6b57; bottom: -130px; left: -110px; }
        .shape.s3 { width: 170px; height: 170px; border-radius: 38px; background: #17c3a5; right: 9%; bottom: 12%; transform: rotate(16deg); }
        .shape.s4 { width: 90px; height: 90px; border-radius: 50%; background: #ffd166; left: 12%; top: 16%; }

        .page { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex;
            flex-direction: column; align-items: center; justify-content: center; padding: 28px 16px; }

        /* ---------- Card ---------- */
        .auth-card { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; padding: 34px 34px 26px;
            box-shadow: 0 28px 56px -20px rgba(6, 20, 66, .55); }

        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
        .brand svg { width: 38px; height: 38px; flex-shrink: 0; }
        .brand-name { font-weight: 600; font-size: 1.2rem; line-height: 1.2; }
        .brand-name small { display: block; font-weight: 400; font-size: .82rem; color: var(--muted); }

        .form-section { animation: none; }
        .form-section h2 { margin: 0 0 6px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400;
            font-size: 2.1rem; line-height: 1.1; text-align: left; color: var(--ink); }
        .form-hint { margin: 0 0 24px; color: var(--muted); font-size: .95rem; text-align: left; }

        .field { margin-bottom: 18px; }
        .field label { display: block; margin-bottom: 6px; font-size: .875rem; font-weight: 500; }
        .field input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px;
            font: inherit; font-size: 1rem; color: var(--ink); background: #fff; box-shadow: none;
            transition: border-color .15s, box-shadow .15s; }
        .field input:hover { border-color: #aebbd0; }
        .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31, 79, 216, .2); }
        .field-help { margin: 6px 0 0; font-size: .8rem; color: var(--muted); }

        .pw { position: relative; }
        .pw input { padding-right: 70px; }
        .toggle-password { position: absolute; top: 50%; right: 7px; transform: translateY(-50%); height: 32px;
            padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--accent);
            font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer; }
        .toggle-password:hover { background: #eef3fc; }
        .toggle-password:focus-visible { outline: 2px solid var(--accent); }

        .auth-card .btn-primary { width: 100%; height: 48px; margin-top: 8px; border: 0; border-radius: 10px;
            background: var(--accent); color: #fff; font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
            box-shadow: none; transform: none; filter: none; transition: background .15s; }
        .auth-card .btn-primary:hover { background: var(--accent-dark); transform: none; filter: none; }
        .auth-card .btn-primary:focus-visible { outline: 3px solid rgba(31, 79, 216, .35); outline-offset: 2px; }
        .auth-card .btn-primary:disabled { opacity: .65; cursor: wait; }

        .toggle-text { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid #e8edf4; font-size: .92rem;
            color: var(--muted); text-align: left; }
        .toggle-text a { color: var(--accent); font-weight: 600; text-decoration: none; }
        .toggle-text a:hover { text-decoration: underline; }

        #error-message:empty { display: none; }
        #error-message { margin-top: 16px; padding: 10px 14px; font-size: .9rem; color: var(--danger);
            background: #fdecea; border-left: 3px solid var(--danger); border-radius: 6px; text-align: left; }

        .page-footer { margin: 18px 0 0; font-size: .8rem; color: rgba(255, 255, 255, .8); }

        @media (max-width: 520px) {
            .auth-card { padding: 26px 22px 22px; border-radius: 16px; }
            .shape.s1 { width: 280px; height: 280px; top: -110px; right: -100px; }
            .shape.s2 { width: 240px; height: 240px; bottom: -100px; left: -90px; }
            .shape.s3, .shape.s4 { display: none; }
            .field input { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div><div class="shape s4"></div>

    <div class="page">
        <div class="auth-card">

            <div class="brand">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="8" fill="#1f4fd8"/>
                    <path d="M8 9h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H15l-5 4v-4H8a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="#fff"/>
                </svg>
                <div class="brand-name">ChatWave<small>Chats, groups and calls</small></div>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="form-section">
                <h2>Sign in</h2>
                <p class="form-hint">Enter your details to continue to your conversations.</p>
                <form id="loginForm">
                    <div class="field">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" autocomplete="username" autocapitalize="none" required>
                    </div>
                    <div class="field">
                        <label for="login-password">Password</label>
                        <div class="pw">
                            <input type="password" id="login-password" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password">Show</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                    <p class="toggle-text">New to ChatWave? <a href="#" onclick="toggleForms(); return false;">Create an account</a></p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form-section hidden">
                <h2>Create an account</h2>
                <p class="form-hint">Choose a username and password to get started.</p>
                <form id="registerForm">
                    <div class="field">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" autocomplete="username" autocapitalize="none" required minlength="3">
                        <p class="field-help">At least 3 characters.</p>
                    </div>
                    <div class="field">
                        <label for="reg-email">Email address</label>
                        <input type="email" id="reg-email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="reg-password">Password</label>
                        <div class="pw">
                            <input type="password" id="reg-password" autocomplete="new-password" required minlength="6">
                            <button type="button" class="toggle-password" data-target="reg-password" aria-label="Show password">Show</button>
                        </div>
                        <p class="field-help">At least 6 characters.</p>
                    </div>
                    <button type="submit" class="btn btn-primary">Create account</button>
                    <p class="toggle-text">Already have an account? <a href="#" onclick="toggleForms(); return false;">Sign in</a></p>
                </form>
            </div>

            <div id="error-message" class="error-message"></div>
        </div>
        <p class="page-footer">&copy; ChatWave</p>
    </div>

    <!-- config.js must load first: it defines API_URL and WS_URL -->
    <script src="js/config.js"></script>
    <script>fetch(API_URL + '/health/db').catch(function () {});</script>
    <script src="js/auth.js"></script>

    <!-- Show / hide password -->
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.dataset.target);
                if (!input) return;
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.textContent = show ? 'Hide' : 'Show';
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                input.focus();
            });
        });
    </script>
</body>
</html>
