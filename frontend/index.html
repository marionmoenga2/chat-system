<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat System - Login</title>
    <link rel="stylesheet" href="css/styles.css?v=4">

    <style>
        /* ---------- Logo ---------- */
        .auth-brand {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .auth-logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 1rem;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.55);
        }

        .auth-logo svg {
            width: 40px;
            height: 40px;
        }

        .auth-brand h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .auth-subtitle {
            margin-top: 0.25rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* ---------- Password field with show/hide button ---------- */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 0.5rem;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .toggle-password:hover,
        .toggle-password:focus-visible {
            background-color: var(--bg-color);
            color: var(--primary-color);
            outline: none;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        /* Show the "eye" icon by default, the "eye-off" icon while the password is visible */
        .toggle-password .icon-eye-off { display: none; }
        .toggle-password.showing .icon-eye { display: none; }
        .toggle-password.showing .icon-eye-off { display: block; }

        /* ---------- Small polish ---------- */
        .form-section h2 {
            text-align: center;
        }

        .btn-primary {
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">

            <!-- Brand / logo -->
            <div class="auth-brand">
                <div class="auth-logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
                        <circle cx="9" cy="11.5" r="0.6" fill="white"/>
                        <circle cx="12.5" cy="11.5" r="0.6" fill="white"/>
                        <circle cx="16" cy="11.5" r="0.6" fill="white"/>
                    </svg>
                </div>
                <h1>Chat System</h1>
                <p class="auth-subtitle">Connect and chat in real time</p>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="form-section">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="login-username" placeholder="Username"
                               autocomplete="username" autocapitalize="none" required>
                    </div>
                    <div class="input-group password-wrapper">
                        <input type="password" id="login-password" placeholder="Password"
                               autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="login-password"
                                aria-label="Show password" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <p class="toggle-text">Don't have an account? <a href="#" onclick="toggleForms(); return false;">Sign up</a></p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form-section hidden">
                <h2>Sign Up</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <input type="text" id="reg-username" placeholder="Username"
                               autocomplete="username" autocapitalize="none" required minlength="3">
                    </div>
                    <div class="input-group">
                        <input type="email" id="reg-email" placeholder="Email"
                               autocomplete="email" required>
                    </div>
                    <div class="input-group password-wrapper">
                        <input type="password" id="reg-password" placeholder="Password"
                               autocomplete="new-password" required minlength="6">
                        <button type="button" class="toggle-password" data-target="reg-password"
                                aria-label="Show password" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                    <p class="toggle-text">Already have an account? <a href="#" onclick="toggleForms(); return false;">Login</a></p>
                </form>
            </div>

            <div id="error-message" class="error-message"></div>
        </div>
    </div>

    <!-- config.js must load first: it defines API_URL and WS_URL -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <!-- Show / hide password -->
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.dataset.target);
                if (!input) return;

                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';

                btn.classList.toggle('showing', show);
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');

                input.focus();
            });
        });
    </script>
</body>
</html>
