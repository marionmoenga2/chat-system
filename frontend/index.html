<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWave - Sign in</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%233b82f6'/><text x='50' y='68' font-size='54' text-anchor='middle'>⚡</text></svg>">
    <link rel="stylesheet" href="css/styles.css?v=5">

    <style>
        /* ---------- Page background ---------- */
        .auth-container {
            position: relative;
            height: 100vh;
            height: 100dvh;
            padding: 1rem;
            overflow-y: auto;
            background: #0b1020;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            pointer-events: none;
            animation: float 14s ease-in-out infinite;
        }
        .blob-1 { width: 380px; height: 380px; background: #06b6d4; top: -120px; left: -100px; }
        .blob-2 { width: 420px; height: 420px; background: #8b5cf6; bottom: -160px; right: -120px; animation-delay: -5s; }
        .blob-3 { width: 260px; height: 260px; background: #ec4899; top: 45%; left: 55%; opacity: 0.35; animation-delay: -9s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(30px, -40px) scale(1.08); }
        }

        /* ---------- Card ---------- */
        .auth-box {
            position: relative;
            z-index: 1;
            margin: auto;
            width: 100%;
            max-width: 420px;
            padding: 2.25rem 2rem 1.75rem;
            border-radius: 28px;
            background: #ffffff;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
        }

        /* ---------- Logo ---------- */
        .auth-brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-logo {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 14px 28px -8px rgba(59, 130, 246, 0.6);
        }

        .auth-logo::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(59, 130, 246, 0.35);
            animation: pulse 2.6s ease-out infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(0.92); opacity: 1; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        .auth-logo svg { width: 48px; height: 48px; }

        .auth-brand h1 {
            margin: 0;
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(90deg, #06b6d4, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-subtitle {
            margin-top: 0.35rem;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* ---------- Headings ---------- */
        .form-section { animation: fadeIn 0.35s ease; }

        .form-section h2 {
            margin-bottom: 0.25rem;
            font-size: 1.35rem;
            text-align: center;
        }

        .form-hint {
            margin-bottom: 1.25rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* ---------- Inputs with icons ---------- */
        .input-group {
            position: relative;
            margin-bottom: 0.9rem;
        }

        .input-group .field-icon {
            position: absolute;
            top: 50%;
            left: 0.95rem;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #94a3b8;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: #f8fafc;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .input-group:focus-within .field-icon { color: #3b82f6; }

        /* ---------- Show / hide password ---------- */
        .password-wrapper input { padding-right: 3rem; }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 0.45rem;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            padding: 0;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .toggle-password:hover,
        .toggle-password:focus-visible {
            background-color: #e0e7ff;
            color: #3b82f6;
            outline: none;
        }

        .toggle-password svg { width: 20px; height: 20px; }
        .toggle-password .icon-eye-off { display: none; }
        .toggle-password.showing .icon-eye { display: none; }
        .toggle-password.showing .icon-eye-off { display: block; }

        /* ---------- Buttons ---------- */
        .btn-primary {
            margin-top: 0.4rem;
            padding: 0.9rem;
            border-radius: 14px;
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
            color: #fff;
            font-size: 1.02rem;
            letter-spacing: 0.01em;
            box-shadow: 0 10px 20px -8px rgba(99, 102, 241, 0.7);
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.7; cursor: wait; }

        .toggle-text { margin-top: 1.1rem; font-size: 0.92rem; }
        .toggle-text a { color: #3b82f6; }
        .toggle-text a:hover { text-decoration: underline; }

        .error-message { min-height: 1.2rem; }

        /* ---------- Feature chips ---------- */
        .auth-features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.25rem;
            padding-top: 1.1rem;
            border-top: 1px solid #e2e8f0;
        }

        .auth-features span {
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .auth-footer {
            margin-top: 0.9rem;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* ---------- Small screens ---------- */
        @media (max-width: 480px) {
            .auth-box { padding: 1.75rem 1.25rem 1.5rem; border-radius: 24px; }
            .auth-logo { width: 72px; height: 72px; }
            .auth-logo svg { width: 42px; height: 42px; }
            .auth-brand h1 { font-size: 1.65rem; }
            .input-group input { font-size: 16px; } /* stops iOS zoom on focus */
        }

        @media (prefers-reduced-motion: reduce) {
            .blob, .auth-logo::before, .form-section { animation: none; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <div class="auth-box">

            <!-- Brand / logo -->
            <div class="auth-brand">
                <div class="auth-logo" aria-hidden="true">
                    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#06b6d4"/>
                                <stop offset="1" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                        <!-- chat bubble -->
                        <path d="M10 8h28a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H22l-8 7v-7h-4a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="#ffffff"/>
                        <!-- lightning bolt -->
                        <path d="M26 14l-8 10h6l-2 8 9-11h-6z" fill="url(#boltGrad)"/>
                    </svg>
                </div>
                <h1>ChatWave</h1>
                <p class="auth-subtitle">Talk freely. Connect instantly.</p>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="form-section">
                <h2>Welcome back 👋</h2>
                <p class="form-hint">Sign in to pick up your conversations</p>
                <form id="loginForm">
                    <div class="input-group">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="login-username" placeholder="Username"
                               autocomplete="username" autocapitalize="none" required>
                    </div>
                    <div class="input-group password-wrapper">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="login-password" placeholder="Password"
                               autocomplete="current-password" required>
                        <button type="button" class="toggle-password" data-target="login-password"
                                aria-label="Show password" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                    <p class="toggle-text">New here? <a href="#" onclick="toggleForms(); return false;">Create an account</a></p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form-section hidden">
                <h2>Create your account ✨</h2>
                <p class="form-hint">It takes less than a minute</p>
                <form id="registerForm">
                    <div class="input-group">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="reg-username" placeholder="Choose a username"
                               autocomplete="username" autocapitalize="none" required minlength="3">
                    </div>
                    <div class="input-group">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/>
                        </svg>
                        <input type="email" id="reg-email" placeholder="Email address"
                               autocomplete="email" required>
                    </div>
                    <div class="input-group password-wrapper">
                        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="reg-password" placeholder="Create a password (6+ characters)"
                               autocomplete="new-password" required minlength="6">
                        <button type="button" class="toggle-password" data-target="reg-password"
                                aria-label="Show password" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <button type="submit" class="btn btn-primary">Create account</button>
                    <p class="toggle-text">Already a member? <a href="#" onclick="toggleForms(); return false;">Sign in</a></p>
                </form>
            </div>

            <div id="error-message" class="error-message"></div>

            <div class="auth-features">
                <span>⚡ Real-time</span>
                <span>🔒 Secure</span>
                <span>💬 Private chats</span>
            </div>
            <p class="auth-footer">© ChatWave</p>
        </div>
    </div>

    <!-- config.js must load first: it defines API_URL and WS_URL -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <!-- Show / hide password -->
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.dataset.target);
                if (!input) return;

                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';

                btn.classList.toggle('showing', show);
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');

                input.focus();
            });
        });
    </script>
</body>
</html>
