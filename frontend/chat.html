<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Messages</title>
    <link rel="stylesheet" href="css/styles.css?v=3">

    <!-- Mobile layout (placed after styles.css so it overrides the old mobile rules) -->
    <style>
        /* The mobile bar is hidden on desktop */
        .mobile-bar {
            display: none;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background-color: var(--primary-color);
            color: white;
            flex-shrink: 0;
        }

        .mobile-bar button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 0.9rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .mobile-bar .mobile-title {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 768px) {
            body {
                height: 100vh;
                height: 100dvh;
            }

            .chat-app {
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
                position: relative;
            }

            /* User list: visible and full screen by default */
            .sidebar {
                position: static !important;
                transform: none !important;
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100%;
                border-right: none;
            }

            .sidebar-header {
                padding: 1rem;
            }

            .user-item {
                padding: 1rem;
                border-bottom: 1px solid var(--border-color);
                border-radius: 0;
            }

            /* Conversation: hidden until a user is selected */
            .chat-main {
                display: none;
                width: 100%;
                height: 100%;
                min-height: 0;
            }

            .chat-app.chat-open .sidebar {
                display: none;
            }

            .chat-app.chat-open .chat-main {
                display: flex;
                flex-direction: column;
            }

            .mobile-bar {
                display: flex;
            }

            .messages-container {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 1rem;
            }

            .message {
                max-width: 85%;
            }

            .message-input-area {
                padding: 0.75rem 1rem;
                flex-shrink: 0;
            }

            /* 16px stops iOS from zooming in when an input is tapped */
            .search-box input,
            .input-wrapper input {
                font-size: 16px;
            }

            .notification {
                left: 10px;
                right: 10px;
                top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-app" id="chat-app">
        <!-- Sidebar: list of users -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Chat System</h2>
                <div class="user-info">
                    <span id="current-user">Loading...</span>
                    <button onclick="logout()" class="btn btn-small">Logout</button>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="user-search" placeholder="Search users..."
                       oninput="filterUsers()" onfocus="loadUsers()">
            </div>

            <div class="users-list" id="users-list">
                <!-- Users populated by JS -->
            </div>
        </aside>

        <!-- Chat area -->
        <main class="chat-main">
            <!-- Mobile navigation bar -->
            <div class="mobile-bar">
                <button onclick="showSidebar()" aria-label="Back to users">&larr; Users</button>
                <span class="mobile-title" id="mobile-chat-title">Chat</span>
            </div>

            <div class="chat-header" id="chat-header">
                <h3>Select a user to start chatting</h3>
            </div>

            <div class="messages-container" id="messages-container">
                <div class="empty-state">Select a user from the sidebar to view messages</div>
            </div>

            <div class="message-input-area" id="message-input-area" style="display: none;">
                <div class="typing-indicator" id="typing-indicator"></div>
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type a message..."
                        onkeypress="handleKeyPress(event)"
                        oninput="handleTyping()"
                    >
                    <button onclick="sendMessage()" class="btn btn-send">Send</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Notification toast -->
    <div id="notification" class="notification"></div>

    <!-- Order matters: config.js defines API_URL and WS_URL, api.js defines apiGet/logout -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>

    <!-- Mobile navigation: switches between the user list and the conversation -->
    <script>
        function showSidebar() {
            document.getElementById('chat-app').classList.remove('chat-open');
        }

        // Wrap selectUser so choosing a user opens the conversation on mobile
        (function () {
            const originalSelectUser = window.selectUser;
            window.selectUser = async function (user) {
                document.getElementById('chat-app').classList.add('chat-open');
                document.getElementById('mobile-chat-title').textContent = user.username;
                return originalSelectUser(user);
            };
        })();
    </script>
</body>
</html>
